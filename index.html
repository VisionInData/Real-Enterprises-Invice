<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Enterprises - Invoice Generator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Source Sans 3', sans-serif; }
        @media print { body { background: white; } }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const COMPANY = {
            name: "REAL ENTERPRISES",
            tagline: "House Keeping & All Labour Supplier",
            subTagline: "Gardening, Swimming Pool, All Machine & Pest Control, Deep Cleaning, Acid Wash & All Maintenance.",
            address: "Jain Vihar Colony, Nadhe Nagar, Near Mane School, Kalewadi, Pimpri, Pune – 411017.",
            mob: "9765259996 / 7066144455",
            email: "sanjaywaghmare25062@gmail.com",
            gst: "27AAYPW9193J1Z",
            pan: "AAYPW9193J"
        };

        const SCOPE_DUTIES = [
            "The garbage will be collected from every floor.",
            "Daily mopping of common area, including corridors and ladders.",
            "Sweeping of parking lot will be done daily.",
            "Washing parking lots will be done after every 10 days.",
            "Common area deep cleaning will be done in 7 days circle.",
            "Terrace area cleaning will be done in 15 days circle."
        ];

        const emptyItem = () => ({ id: Date.now(), srNo: '', description: '', perPerson: '', rate: '', duty: '8 Hrs.', payment: '' });

        const InvoiceApp = () => {
            const [page, setPage] = useState('editor');
            const [invoiceNumber, setInvoiceNumber] = useState(1);
            const [history, setHistory] = useState([]);
            const [toName, setToName] = useState('');
            const [toAddress, setToAddress] = useState('');
            const [serviceContext, setServiceContext] = useState('');
            const [items, setItems] = useState([
                { id: 1, srNo: '1', description: 'Men Housekeeping', perPerson: '01', rate: '15000', duty: '8 Hrs.', payment: '15000' },
                { id: 2, srNo: '2', description: 'Woman Housekeeping', perPerson: '01', rate: '15000', duty: '8 Hrs.', payment: '15000' },
                { id: 3, srNo: '3', description: 'Supervisor', perPerson: '01', rate: '18000', duty: '8 Hrs.', payment: '18000' },
                { id: 4, srNo: '4', description: 'Service Charges 5%\nPer person on total amount', perPerson: '', rate: '', duty: '', payment: '2400' },
                { id: 5, srNo: '5', description: 'Material', perPerson: '', rate: '', duty: '', payment: '' },
            ]);
            const [gstPercent, setGstPercent] = useState(18);
            const [showScope, setShowScope] = useState(true);
            const [preview, setPreview] = useState(null);
            const printRef = useRef();

            const subtotal = items.reduce((sum, item) => sum + (parseFloat(item.payment) || 0), 0);
            const gstAmount = (subtotal * gstPercent) / 100;
            const total = subtotal + gstAmount;

            const handleItemChange = (id, field, value) => {
                setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            };

            const addItem = () => {
                const next = items.length + 1;
                setItems([...items, { ...emptyItem(), srNo: String(next) }]);
            };

            const removeItem = (id) => {
                if (items.length > 1) setItems(items.filter(i => i.id !== id));
            };

            const buildInvoiceData = () => ({
                invoiceNumber: String(invoiceNumber).padStart(4, '0'),
                date: new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' }),
                toName, toAddress, serviceContext,
                items, gstPercent,
                subtotal: subtotal.toFixed(2),
                gstAmount: gstAmount.toFixed(2),
                total: total.toFixed(2),
                showScope
            });

            const openPreview = () => {
                if (!toName) { alert('Please enter the recipient name (To field)'); return; }
                setPreview(buildInvoiceData());
                setPage('preview');
            };

            const saveInvoice = () => {
                const inv = buildInvoiceData();
                const updated = [inv, ...history];
                setHistory(updated);
                const newNum = invoiceNumber + 1;
                setInvoiceNumber(newNum);
                alert('Invoice saved!');
                setPage('history');
            };

            const downloadPDF = () => {
                const loadScript = (src) => new Promise((res, rej) => {
                    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
                    const s = document.createElement('script');
                    s.src = src; s.onload = res; s.onerror = rej;
                    document.head.appendChild(s);
                });
                Promise.all([
                    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
                    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
                ]).then(() => setTimeout(() => {
                    window.html2canvas(printRef.current, { scale: 2, useCORS: true }).then(canvas => {
                        const imgData = canvas.toDataURL('image/png');
                        const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
                        const imgWidth = 210, imgHeight = (canvas.height * imgWidth) / canvas.width;
                        pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                        pdf.save(`RealEnterprises-Invoice-${preview.invoiceNumber}.pdf`);
                    });
                }, 400));
            };

            const InvoiceDoc = ({ inv }) => (
                <div ref={printRef} style={{ background: 'white', padding: '36px 40px', fontFamily: 'Source Sans 3, sans-serif', maxWidth: '800px', margin: '0 auto', color: '#111' }}>
                    {/* Header */}
                    <div style={{ textAlign: 'center', borderBottom: '3px double #222', paddingBottom: '16px', marginBottom: '12px' }}>
                        <h1 style={{ fontFamily: 'Merriweather, serif', fontSize: '38px', fontWeight: '900', color: '#b91c1c', letterSpacing: '2px', margin: 0 }}>REAL ENTERPRISES</h1>
                        <p style={{ fontWeight: '700', fontSize: '14px', margin: '6px 0 4px' }}>House Keeping & All Labour Supplier</p>
                        <p style={{ fontSize: '12px', margin: '0 0 6px', fontWeight: '600', fontStyle: 'italic' }}>Gardening, Swimming Pool, All Machine &amp; Pest Control, Deep Cleaning, Acid Wash &amp; All Maintenance.</p>
                        <p style={{ fontSize: '12px', margin: '0' }}><strong>Office Add :-</strong> Jain Vihar Colony, Nadhe Nagar, Near Mane School, Kalewadi, Pimpri, Pune – 411017.</p>
                        <p style={{ fontSize: '12px', margin: '4px 0 0' }}><strong>Mob. No. :-</strong> 9765259996 / 7066144455 &nbsp;&nbsp; <strong>Email :-</strong> sanjaywaghmare25062@gmail.com</p>
                    </div>

                    {/* Invoice meta */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', marginBottom: '10px' }}>
                        <div>
                            <p style={{ margin: '2px 0' }}><strong>GST No.:</strong> {COMPANY.gst}</p>
                            <p style={{ margin: '2px 0' }}><strong>PAN No.:</strong> {COMPANY.pan}</p>
                        </div>
                        <div style={{ textAlign: 'right' }}>
                            <p style={{ margin: '2px 0' }}><strong>Invoice No.:</strong> INV-{inv.invoiceNumber}</p>
                            <p style={{ margin: '2px 0' }}><strong>Date:</strong> {inv.date}</p>
                        </div>
                    </div>

                    {/* To */}
                    <div style={{ marginBottom: '12px', fontSize: '13px' }}>
                        <p style={{ margin: '0 0 2px' }}><strong>To,</strong></p>
                        {inv.toName && <p style={{ margin: '0 0 2px', paddingLeft: '12px', fontWeight: '600' }}>{inv.toName}</p>}
                        {inv.toAddress && <p style={{ margin: '0', paddingLeft: '12px' }}>{inv.toAddress}</p>}
                    </div>

                    {/* Context paragraph */}
                    {inv.serviceContext && (
                        <p style={{ fontSize: '13px', margin: '0 0 14px', lineHeight: '1.6' }}>{inv.serviceContext}</p>
                    )}

                    {/* Section title */}
                    <p style={{ textAlign: 'center', fontWeight: '700', fontSize: '14px', margin: '0 0 8px', textDecoration: 'underline' }}>Housekeeping Quotation with Material full month</p>

                    {/* Items table */}
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px', marginBottom: '16px' }}>
                        <thead>
                            <tr style={{ background: '#f3f4f6' }}>
                                <th style={{ border: '1px solid #555', padding: '7px 8px', textAlign: 'center', width: '40px' }}>Sr. No.</th>
                                <th style={{ border: '1px solid #555', padding: '7px 8px', textAlign: 'left' }}>Details</th>
                                <th style={{ border: '1px solid #555', padding: '7px 8px', textAlign: 'center', width: '70px' }}>Per Person</th>
                                <th style={{ border: '1px solid #555', padding: '7px 8px', textAlign: 'right', width: '80px' }}>Rate</th>
                                <th style={{ border: '1px solid #555', padding: '7px 8px', textAlign: 'center', width: '70px' }}>Duty</th>
                                <th style={{ border: '1px solid #555', padding: '7px 8px', textAlign: 'right', width: '90px' }}>Payment</th>
                            </tr>
                        </thead>
                        <tbody>
                            {inv.items.map((item, idx) => (
                                <tr key={item.id}>
                                    <td style={{ border: '1px solid #555', padding: '6px 8px', textAlign: 'center', verticalAlign: 'top' }}>{item.srNo}</td>
                                    <td style={{ border: '1px solid #555', padding: '6px 8px', verticalAlign: 'top', whiteSpace: 'pre-line' }}>{item.description}</td>
                                    <td style={{ border: '1px solid #555', padding: '6px 8px', textAlign: 'center', verticalAlign: 'top' }}>{item.perPerson}</td>
                                    <td style={{ border: '1px solid #555', padding: '6px 8px', textAlign: 'right', verticalAlign: 'top' }}>{item.rate ? parseInt(item.rate).toLocaleString('en-IN') : ''}</td>
                                    <td style={{ border: '1px solid #555', padding: '6px 8px', textAlign: 'center', verticalAlign: 'top' }}>{item.duty}</td>
                                    <td style={{ border: '1px solid #555', padding: '6px 8px', textAlign: 'right', verticalAlign: 'top' }}>{item.payment ? parseInt(item.payment).toLocaleString('en-IN') + '/-' : ''}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

                    {/* GST note */}
                    <p style={{ fontSize: '13px', margin: '0 0 6px', fontWeight: '600' }}>GST {inv.gstPercent}% Extra in actual</p>

                    {/* Totals */}
                    <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: '20px' }}>
                        <table style={{ fontSize: '13px', borderCollapse: 'collapse', minWidth: '260px' }}>
                            <tr>
                                <td style={{ padding: '4px 12px', textAlign: 'right', fontWeight: '600' }}>Subtotal:</td>
                                <td style={{ padding: '4px 12px', textAlign: 'right', borderBottom: '1px solid #aaa' }}>₹ {parseFloat(inv.subtotal).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                            </tr>
                            <tr>
                                <td style={{ padding: '4px 12px', textAlign: 'right', fontWeight: '600' }}>GST ({inv.gstPercent}%):</td>
                                <td style={{ padding: '4px 12px', textAlign: 'right', borderBottom: '1px solid #aaa' }}>₹ {parseFloat(inv.gstAmount).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                            </tr>
                            <tr style={{ background: '#fef2f2' }}>
                                <td style={{ padding: '6px 12px', textAlign: 'right', fontWeight: '700', fontSize: '14px' }}>Total Amount:</td>
                                <td style={{ padding: '6px 12px', textAlign: 'right', fontWeight: '700', fontSize: '14px', border: '2px solid #b91c1c', color: '#b91c1c' }}>₹ {parseFloat(inv.total).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                            </tr>
                        </table>
                    </div>

                    {/* Scope of Work */}
                    {inv.showScope && (
                        <div style={{ marginBottom: '24px', fontSize: '13px' }}>
                            <p style={{ fontWeight: '700', margin: '0 0 6px', fontSize: '13px' }}>Scope of Work:</p>
                            <p style={{ margin: '0 0 4px' }}>Floor &nbsp;&nbsp;&nbsp; Parking &nbsp;&nbsp;&nbsp; Offices &nbsp;&nbsp;&nbsp; Common &nbsp;&nbsp;&nbsp; Lobby</p>
                            <p style={{ fontWeight: '700', margin: '8px 0 4px' }}>❖ Duties:</p>
                            <ul style={{ margin: '0', paddingLeft: '20px', lineHeight: '1.8' }}>
                                {SCOPE_DUTIES.map((d, i) => <li key={i}>{d}</li>)}
                            </ul>
                        </div>
                    )}

                    {/* Footer signature */}
                    <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '32px' }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ height: '50px' }}></div>
                            <p style={{ fontWeight: '700', fontSize: '14px', margin: 0 }}>For Real Enterprises</p>
                            <p style={{ fontSize: '11px', color: '#555', margin: '4px 0 0' }}>Authorised Signatory</p>
                        </div>
                    </div>

                    <div style={{ borderTop: '1px solid #ccc', marginTop: '20px', paddingTop: '10px', textAlign: 'center', fontSize: '11px', color: '#777' }}>
                        <p style={{ margin: 0 }}>This is a computer-generated invoice. | Real Enterprises, Pimpri, Pune – 411017</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                    {/* Header */}
                    <header style={{ background: 'white', borderBottom: '4px solid #b91c1c' }} className="shadow-md">
                        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
                            <div>
                                <h1 style={{ fontFamily: 'Merriweather, serif', color: '#b91c1c', fontWeight: '900', fontSize: '22px', margin: 0 }}>REAL ENTERPRISES</h1>
                                <p className="text-xs text-gray-500 mt-0.5">House Keeping & All Labour Supplier</p>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => { setPage('editor'); setPreview(null); }} className={`px-4 py-2 rounded font-semibold text-sm transition ${page === 'editor' ? 'bg-red-700 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>✏️ New Invoice</button>
                                <button onClick={() => setPage('history')} className={`px-4 py-2 rounded font-semibold text-sm transition ${page === 'history' ? 'bg-red-700 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>📋 History ({history.length})</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-8">

                        {/* EDITOR */}
                        {page === 'editor' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-gray-800">Create Invoice</h2>

                                {/* Recipient */}
                                <div className="bg-white rounded-lg shadow p-6 border-l-4" style={{ borderColor: '#b91c1c' }}>
                                    <h3 className="font-bold text-gray-700 mb-4 uppercase text-sm tracking-wide">Recipient Details</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">To (Name / Society / Company)</label>
                                            <input value={toName} onChange={e => setToName(e.target.value)} placeholder="e.g. ABC Society, Wakad" className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-400 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-gray-600 mb-1">Address</label>
                                            <input value={toAddress} onChange={e => setToAddress(e.target.value)} placeholder="Full address" className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-400 outline-none" />
                                        </div>
                                    </div>
                                    <div className="mt-4">
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Opening Paragraph <span className="text-gray-400 font-normal">(optional)</span></label>
                                        <textarea value={serviceContext} onChange={e => setServiceContext(e.target.value)} rows={2} placeholder="e.g. We are pleased to inform you that we providing good housekeeping services. From last seven years our persons deployed in commercial building (GO square B Wing Wakad)" className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-400 outline-none resize-none" />
                                    </div>
                                </div>

                                {/* Line Items */}
                                <div className="bg-white rounded-lg shadow p-6">
                                    <h3 className="font-bold text-gray-700 mb-4 uppercase text-sm tracking-wide">Line Items</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm border-collapse">
                                            <thead>
                                                <tr className="bg-gray-800 text-white">
                                                    <th className="px-3 py-2 text-center border border-gray-600 w-12">Sr.</th>
                                                    <th className="px-3 py-2 text-left border border-gray-600">Details</th>
                                                    <th className="px-3 py-2 text-center border border-gray-600 w-20">Per Person</th>
                                                    <th className="px-3 py-2 text-right border border-gray-600 w-24">Rate (₹)</th>
                                                    <th className="px-3 py-2 text-center border border-gray-600 w-24">Duty</th>
                                                    <th className="px-3 py-2 text-right border border-gray-600 w-28">Payment (₹)</th>
                                                    <th className="px-3 py-2 text-center border border-gray-600 w-12">Del</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {items.map((item, idx) => (
                                                    <tr key={item.id} className={idx % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                                                        <td className="px-2 py-1 border border-gray-300">
                                                            <input value={item.srNo} onChange={e => handleItemChange(item.id, 'srNo', e.target.value)} className="w-full text-center border border-gray-200 rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-red-300" />
                                                        </td>
                                                        <td className="px-2 py-1 border border-gray-300">
                                                            <textarea value={item.description} onChange={e => handleItemChange(item.id, 'description', e.target.value)} rows={2} className="w-full border border-gray-200 rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-red-300 resize-none" placeholder="Description" />
                                                        </td>
                                                        <td className="px-2 py-1 border border-gray-300">
                                                            <input value={item.perPerson} onChange={e => handleItemChange(item.id, 'perPerson', e.target.value)} className="w-full text-center border border-gray-200 rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-red-300" placeholder="01" />
                                                        </td>
                                                        <td className="px-2 py-1 border border-gray-300">
                                                            <input type="number" value={item.rate} onChange={e => handleItemChange(item.id, 'rate', e.target.value)} className="w-full text-right border border-gray-200 rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-red-300" placeholder="0" />
                                                        </td>
                                                        <td className="px-2 py-1 border border-gray-300">
                                                            <input value={item.duty} onChange={e => handleItemChange(item.id, 'duty', e.target.value)} className="w-full text-center border border-gray-200 rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-red-300" placeholder="8 Hrs." />
                                                        </td>
                                                        <td className="px-2 py-1 border border-gray-300">
                                                            <input type="number" value={item.payment} onChange={e => handleItemChange(item.id, 'payment', e.target.value)} className="w-full text-right border border-gray-200 rounded px-1 py-1 text-xs outline-none focus:ring-1 focus:ring-red-300" placeholder="0" />
                                                        </td>
                                                        <td className="px-2 py-1 border border-gray-300 text-center">
                                                            <button onClick={() => removeItem(item.id)} className="text-red-500 hover:text-red-700 text-lg">🗑</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <button onClick={addItem} className="mt-4 flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold text-sm transition">➕ Add Row</button>
                                </div>

                                {/* GST + Options */}
                                <div className="bg-white rounded-lg shadow p-6 flex flex-wrap gap-6 items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <label className="text-sm font-semibold text-gray-700">GST %</label>
                                        <input type="number" value={gstPercent} onChange={e => setGstPercent(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-2 focus:ring-red-400 outline-none" />
                                        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                            <input type="checkbox" checked={showScope} onChange={e => setShowScope(e.target.checked)} className="rounded" />
                                            Include Scope of Work
                                        </label>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-sm text-gray-500">Subtotal: <span className="font-bold text-gray-800">₹ {subtotal.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span></p>
                                        <p className="text-sm text-gray-500">GST ({gstPercent}%): <span className="font-bold text-gray-800">₹ {gstAmount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span></p>
                                        <p className="text-lg font-bold mt-1" style={{ color: '#b91c1c' }}>Total: ₹ {total.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</p>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3">
                                    <button onClick={openPreview} className="flex items-center gap-2 text-white px-6 py-3 rounded font-semibold transition text-sm" style={{ background: '#b91c1c' }}>👁️ Preview Invoice</button>
                                </div>
                            </div>
                        )}

                        {/* PREVIEW */}
                        {page === 'preview' && preview && (
                            <div>
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Invoice Preview</h2>
                                    <button onClick={() => { setPage('editor'); setPreview(null); }} className="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded font-semibold text-sm">✕ Back</button>
                                </div>
                                <div className="bg-white rounded-lg shadow-lg overflow-hidden mb-6">
                                    <InvoiceDoc inv={preview} />
                                </div>
                                <div className="flex gap-3 justify-center flex-wrap">
                                    <button onClick={downloadPDF} className="flex items-center gap-2 text-white px-6 py-3 rounded font-semibold transition text-sm" style={{ background: '#b91c1c' }}>📥 Download PDF</button>
                                    <button onClick={saveInvoice} className="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded font-semibold transition text-sm">💾 Save Invoice</button>
                                </div>
                            </div>
                        )}

                        {/* HISTORY */}
                        {page === 'history' && (
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">Invoice History</h2>
                                {history.length === 0 ? (
                                    <div className="bg-white rounded-lg shadow p-12 text-center text-gray-500">No invoices saved yet.</div>
                                ) : (
                                    <div className="space-y-4">
                                        {history.map((inv, idx) => (
                                            <div key={idx} className="bg-white rounded-lg shadow p-5 flex items-center justify-between border-l-4" style={{ borderColor: '#b91c1c' }}>
                                                <div>
                                                    <p className="font-bold text-gray-800">INV-{inv.invoiceNumber} — {inv.toName || 'Unknown'}</p>
                                                    <p className="text-sm text-gray-500">{inv.date}</p>
                                                    <p className="font-bold text-lg mt-1" style={{ color: '#b91c1c' }}>₹ {parseFloat(inv.total).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</p>
                                                </div>
                                                <div className="flex gap-3">
                                                    <button onClick={() => { setPreview(inv); setPage('preview'); }} className="text-white px-4 py-2 rounded font-semibold text-sm transition" style={{ background: '#b91c1c' }}>👁️ View</button>
                                                    <button onClick={() => setHistory(history.filter((_, i) => i !== idx))} className="bg-gray-200 hover:bg-red-100 text-red-700 px-4 py-2 rounded font-semibold text-sm transition">🗑 Delete</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <footer style={{ background: '#111', color: '#ccc' }} className="mt-12 py-6 text-center text-xs">
                        <p className="font-bold text-white" style={{ fontFamily: 'Merriweather, serif' }}>REAL ENTERPRISES</p>
                        <p className="mt-1">GST: {COMPANY.gst} &nbsp;|&nbsp; PAN: {COMPANY.pan} &nbsp;|&nbsp; {COMPANY.mob}</p>
                        <p className="mt-1">{COMPANY.address}</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<InvoiceApp />, document.getElementById('root'));
    </script>
</body>
</html>
